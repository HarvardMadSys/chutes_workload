[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chutes-load-simulator"
version = "1.0.0"
description = "Session reconstruction and routing simulator for the Chutes LLM serving trace"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "CC-BY-4.0"}
dependencies = [
    "duckdb>=1.0.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["chutes_sim*"]
